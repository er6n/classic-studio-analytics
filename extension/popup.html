<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  body { width: 240px; margin: 0; padding: 14px 16px; font: 13px/1.4 Roboto, Arial, sans-serif; background: #282828; color: #fff; }
  .row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .title { font-size: 14px; font-weight: 500; }
  #state { color: #aaa; font-size: 12px; margin-top: 2px; }
  .switch { position: relative; width: 36px; height: 20px; flex: none; }
  .switch input { opacity: 0; width: 0; height: 0; }
  .track { position: absolute; inset: 0; background: #717171; border-radius: 10px; cursor: pointer; transition: background .15s; }
  .track::after { content: ''; position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; border-radius: 50%; background: #fff; transition: transform .15s; }
  input:checked + .track { background: #3ea6ff; }
  input:checked + .track::after { transform: translateX(16px); }
  input:disabled + .track { opacity: .4; cursor: default; }
</style>
</head>
<body>
  <div class="row">
    <div>
      <div class="title">Classic Analytics</div>
      <div id="state"></div>
    </div>
    <label class="switch">
      <input type="checkbox" id="toggle">
      <span class="track"></span>
    </label>
  </div>
  <script src="popup.js"></script>
</body>
</html>
